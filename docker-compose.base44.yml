services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      # keep installed modules inside the container, not on the host bind mount
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=
    restart: unless-stopped

volumes:
  node_modules:

services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      # keep installed modules inside the container, not on the host bind mount
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "CI=true npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Vite >= 6.1 appends this to server.allowedHosts (platform-provided)
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_API_URL=
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:

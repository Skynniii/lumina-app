services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env

volumes:
  node_modules:
